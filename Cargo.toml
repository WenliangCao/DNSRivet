[package]
name = "dnsrivet"
version = "0.3.6"
edition = "2024"
license = "MIT"
description = "Lightweight encrypted DNS forwarding daemon for macOS with DoH, DoH3, DoT, and DoQ"
repository = "https://github.com/WenliangCao/DNSRivet"
readme = "README.md"
keywords = ["dns", "doh", "doh3", "dot", "doq"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
# Raw DoH/DoH3/DoT/DoQ transports and re-exported DNS wire types.
# Enable only ring-backed transports, not local DNSSEC validation.
hickory-net = { version = "0.26.3", default-features = false, features = [
    "tokio",
    "https-ring",
    "h3-ring",
    "quic-ring",
    "tls-ring",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
webpki-roots = "0.26"
tokio = { version = "1", default-features = false, features = [
    "rt",
    "net",
    "time",
    "io-util",
    "sync",
    "macros",
    "signal",
] }
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse", "display"] }
log = { version = "0.4", features = ["std"] }
lru = "0.18"
lexopt = "0.3"
nix = { version = "0.31.3", default-features = false, features = ["user", "net"] }

[dev-dependencies]
futures-core = { version = "0.3", default-features = false }
tokio = { version = "1", default-features = false, features = ["test-util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
